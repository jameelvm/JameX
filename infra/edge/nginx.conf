worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # HLS manifests and segments are immutable once written, so an edge node can
  # hold them indefinitely. This is the CDN / ISP point-of-presence tier from
  # chapters 3 and 5, in miniature.
  proxy_cache_path /var/cache/nginx/media
                   levels=1:2
                   keys_zone=media_cache:16m
                   max_size=2g
                   inactive=24h
                   use_temp_path=off;

  # LocalStack's S3 endpoint inside the compose network.
  upstream origin {
    server localstack:4566;
  }

  log_format edge '$remote_addr "$request" $status '
                  'cache=$upstream_cache_status bytes=$body_bytes_sent';
  access_log /dev/stdout edge;

  map $request_uri $jamex_cacheable {
    default            1;
    ~*\.m3u8$          1;   # manifests: short TTL, they can be rewritten
    ~*\.(ts|m4s|mp4)$  1;   # segments: immutable
  }

  server {
    listen 80;
    server_name _;

    # Player and page assets are cross-origin (web on :3000 -> edge on :8081).
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Origin, Accept" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

    # Makes the cache tier observable: watch this flip MISS -> HIT as the
    # player pulls segments, and BYPASS when you force a revalidate.
    add_header X-JameX-Cache $upstream_cache_status always;
    add_header X-JameX-Tier  "edge-pop" always;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # /media/<key> -> s3://jamex-media/<key>
    location /media/ {
      if ($request_method = OPTIONS) { return 204; }

      rewrite ^/media/(.*)$ /jamex-media/$1 break;

      proxy_pass http://origin;
      proxy_http_version 1.1;
      proxy_set_header Host localhost:4566;
      proxy_set_header Connection "";

      proxy_cache            media_cache;
      proxy_cache_key        $uri;
      proxy_cache_valid      200 206 24h;
      proxy_cache_valid      404 10s;
      proxy_cache_methods    GET HEAD;
      proxy_no_cache         $arg_nocache;
      proxy_cache_bypass     $arg_nocache;

      # Serve stale rather than surfacing an origin blip to the player — the
      # availability trade-off from chapter 4.
      proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_lock       on;
      proxy_cache_revalidate on;
    }
  }
}
